name: Native PipeLang
on:
  workflow_dispatch:
  push:
    branches: [master, staging, dev]
  pull_request:
    branches: [master, staging, dev]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare native containment
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends cmake g++ strace
          test -x /usr/bin/cmake
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          command -v cmake c++ strace systemd-run
      - name: Install checksum-locked DockPipe
        run: cmake -DOUTPUT_DIRECTORY="$RUNNER_TEMP/dockpipe" -P tooling/bootstrap-dockpipe.cmake
      - name: Build, check and test through DockPipe
        run: |
          "$DOCKPIPE_BIN" --workflow-file workflows/build/config.yml
          "$DOCKPIPE_BIN" --workflow-file workflows/check/config.yml
          "$DOCKPIPE_BIN" --workflow-file workflows/test/config.yml
  test-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install checksum-locked DockPipe
        shell: pwsh
        run: cmake -DOUTPUT_DIRECTORY="$env:RUNNER_TEMP/dockpipe" -P tooling/bootstrap-dockpipe.cmake
      - name: Build, check, test and package through native DockPipe workflows
        shell: pwsh
        run: |
          & $env:DOCKPIPE_BIN --workflow-file workflows/build/config.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:DOCKPIPE_BIN --workflow-file workflows/check/config.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:DOCKPIPE_BIN --workflow-file workflows/test/config.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:DOCKPIPE_BIN --workflow-file workflows/release/config.yml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
