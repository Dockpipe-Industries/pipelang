name: CodeQL
on:
  workflow_dispatch:
  pull_request:
    branches: [master, staging, dev]
  push:
    branches: [master, staging, dev]
  schedule:
    - cron: '18 11 * * 1'
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  security-events: write
jobs:
  codeql:
    # Preserve existing required check names while retiring the Go implementation.
    name: CodeQL (${{ matrix.context }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            context: Go
          - language: actions
            context: Actions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize native analysis
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - name: Analyze sources
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
