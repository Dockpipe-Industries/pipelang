name: CodeQL
on:
  workflow_dispatch:
  pull_request:
    branches: [master, staging, dev]
  push:
    branches: [master, staging, dev]
  schedule:
    - cron: '18 11 * * 1'
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL (${{ matrix.language == 'go' && 'Go' || 'Actions' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: matrix.language == 'go'
        with:
          go-version: '1.26.10'
      - name: Install the locked Dockpipe version
        if: matrix.language == 'go'
        run: python3 tooling/bootstrap_dockpipe.py --output "$RUNNER_TEMP/dockpipe"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - name: Build through Dockpipe
        if: matrix.language == 'go'
        env:
          DOCKPIPE_GO_SDK_INPUTS: ${{ runner.temp }}/sdk-inputs
        run: '"$DOCKPIPE_BIN" --workflow-file workflows/build/config.yml --workdir "$GITHUB_WORKSPACE" --'
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
