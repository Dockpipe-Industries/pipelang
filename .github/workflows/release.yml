name: Standalone release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - name: Install the locked Dockpipe version
        run: python3 tooling/bootstrap_dockpipe.py --output "$RUNNER_TEMP/dockpipe"
      - name: Build standalone archives through Dockpipe
        run: |
          "$DOCKPIPE_BIN" --workflow-file workflows/release/config.yml --
          echo "PIPELANG_RELEASE_DIR=$("$DOCKPIPE_BIN" scope workflow release release)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: pipelang-standalone
          path: ${{ env.PIPELANG_RELEASE_DIR }}
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pipelang-standalone
          path: release-artifacts
      - name: Create a reviewable standalone GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "PipeLang $GITHUB_REF_NAME" \
            --notes 'Standalone CLI archives and checksums. Go SDK consumers use the matching module tag. Native platform qualification is recorded separately.'
