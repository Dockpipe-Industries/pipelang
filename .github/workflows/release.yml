name: Native SDK package candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare native containment
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          command -v cmake c++ strace systemd-run
      - name: Install checksum-locked DockPipe
        run: cmake -DOUTPUT_DIRECTORY="$RUNNER_TEMP/dockpipe" -P tooling/bootstrap-dockpipe.cmake
      - name: Build, qualify and package through DockPipe
        run: |
          "$DOCKPIPE_BIN" --workflow-file workflows/build/config.yml
          "$DOCKPIPE_BIN" --workflow-file workflows/check/config.yml
          "$DOCKPIPE_BIN" --workflow-file workflows/test/config.yml
          "$DOCKPIPE_BIN" --workflow-file workflows/release/config.yml
          echo "PACKAGE_DIRECTORY=$(readlink -f bin/native-package)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipelang-native-linux-amd64
          path: ${{ env.PACKAGE_DIRECTORY }}
          if-no-files-found: error
          retention-days: 7
